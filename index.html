아니었다면?',value:'계략공'},{label:'가끔은 그냥 맡겨버리는 것도 나쁘지 않잖아',value:'능욕공·도미넌트공·절륜공'},{label:'쉽게 속을 보여주지 않는 사람이 더 신경 쓰여',value:'무심공·까칠공'},{label:'서툰 마음은 오래갈수록 더 좋잖아',value:'순진공·짝사랑공'},{label:'조금 늦게 깨닫는 사람에게도 기회는 있어야지',value:'자낮공·후회공'},{label:'어딜 가도 자기 몫은 확실히 하는 사람이 좋아',value:'능력공·강공'},{label:'누구인지가 꼭 중요할까?',value:'모브공'},{label:'평범한 기준에서 조금 벗어나도 괜찮잖아',value:'인외공'},{label:'정해진 모습대로만 흘러갈 필요는 없잖아',value:'오메가공·알파공'}],SOO_POOL=[{label:'쉽게 마음대로 되는 사람은 재미없잖아',value:'강수'},{label:'조금 많이 힘들어야 더 기억에 남는 법이지',value:'굴림수·상처수'},{label:'가끔은 생각보다 몸이 먼저 움직여도 괜찮잖아',value:'음란수·유혹수·마조수·적극수'},{label:'말하지 않아도 자연스럽게 맞춰지는 사람이 좋아',value:'순진수·순종수·다정수'},{label:'마음 하나쯤은 쉽게 변하지 않았으면 좋겠어',value:'순정수·짝사랑수'},{label:'조금 늦게 알아차리는 마음도 나쁘지 않아',value:'후회수·자낮수'},{label:'정해진 모습대로만 흘러갈 필요는 없잖아',value:'오메가수·알파수'},{label:'둘만의 이야기로 끝나지 않아도 좋을 것 같아',value:'임신수'},{label:'쉽게 알 수 없는 사람일수록 자꾸 신경 쓰여',value:'까칠수·무심수'}];
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}let answers={},questions=[],qIndex=0;function buildQuestions(){answers={genre:null,gong:null,soo:null,cp:null,age:null,length:null};questions=[{key:'genre',title:'요즘 자꾸 손이 가는 것은',options:shuffle(GENRE_POOL).slice(0,6)},{key:'gong',title:'좋아하는 공 키워드는?',options:shuffle(GONG_POOL).slice(0,6)},{key:'soo',title:'좋아하는 수 키워드는?',options:shuffle(SOO_POOL).slice(0,6)},{key:'cp',title:'끌리는 조합이 있다면?',options:shuffle(CP_POOL)},{key:'age',title:'수위는 어느 정도가 좋아요?',options:[{label:'손만 잡아도 충분히 설렐 수 있어',value:'전체이용가'},{label:'키스 그 이상은 살짝 아슬아슬한 정도가 좋아',value:'15세'},{label:'굳이 중요한 장면을 건너뛸 필요는 없잖아',value:'19세'},{label:'딱히 상관없어',value:'all'}]},{key:'length',title:'분량은 어느 정도가 좋아요?',options:[{label:'짧고 굵게 한 번에 끝내는 게 좋아',value:'단편'},{label:'짧은 이야기를 이것저것 골라 먹는 게 좋아',value:'단편집'},{label:'적당히 오래 빠져 있을 수 있는 이야기가 좋아',value:'중장편'},{label:'한번 빠지면 한동안 헤어나오고 싶지 않아',value:'장편'},{label:'아무거나 상관없어',value:'all'}]}]}
function renderProgress(){surveyProgressEl.replaceChildren();questions.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i<qIndex?' done':i===qIndex?' current':'');surveyProgressEl.appendChild(d)})}function renderStep(){renderProgress();const q=questions[qIndex];surveyQCountEl.textContent=`Q${qIndex+1} / ${questions.length}`;surveyQTitleEl.textContent=q.title;surveyOptionsEl.replaceChildren();q.options.forEach(opt=>{const b=document.createElement('button');b.type='button';b.className='survey-opt';b.textContent=opt.label;if(answers[q.key]?.label===opt.label)b.classList.add('picked');b.onclick=()=>choose(opt);surveyOptionsEl.appendChild(b)});surveyBackBtn.disabled=qIndex===0}
function choose(opt){const q=questions[qIndex];answers[q.key]=opt;[...surveyOptionsEl.children].forEach(b=>b.classList.remove('picked'));const idx=q.options.indexOf(opt);if(surveyOptionsEl.children[idx])surveyOptionsEl.children[idx].classList.add('picked');setTimeout(()=>{if(qIndex<questions.length-1){qIndex++;renderStep()}else finishSurvey()},220)}surveyBackBtn.addEventListener('click',()=>{if(qIndex>0){qIndex--;renderStep()}});surveySkipBtn.addEventListener('click',()=>{if(qIndex<questions.length-1){qIndex++;renderStep()}else finishSurvey()});function startSurvey(){buildQuestions();qIndex=0;renderStep();surveyForm.style.display='block';surveyResults.style.display='none'}openSurveyBtn.addEventListener('click',()=>{startSurvey();surveyOverlay.classList.add('open')});closeSurveyBtn.addEventListener('click',()=>surveyOverlay.classList.remove('open'));surveyOverlay.addEventListener('click',e=>{if(e.target===surveyOverlay)surveyOverlay.classList.remove('open')});
function finishSurvey(){const sg=answers.genre?[answers.genre.value]:[],sp=[answers.gong,answers.soo].filter(Boolean).map(a=>a.value),sc=answers.cp?[answers.cp.value]:[],sa=answers.age?.value||'all',sl=answers.length?.value||'all';const scored=allPosts.map(post=>{const genre=Array.isArray(post.genreKeywords)?post.genreKeywords:Array.isArray(post.keywords)?post.keywords:[],pair=Array.isArray(post.pairingKeywords)?post.pairingKeywords:[],all=[...genre,...pair],cp=Array.isArray(post.cp)?post.cp:[];let score=0,matched=[];const fuzzy=v=>all.find(t=>String(t).includes(v)||v.includes(String(t)));sg.forEach(g=>{const m=fuzzy(g);if(m){score++;matched.push(m)}});sp.forEach(p=>{const m=fuzzy(p);if(m){score++;matched.push(m)}});sc.forEach(c=>{if(cp.includes(c)){score++;matched.push(c)}});if(sa!=='all'&&(post.age||'all-ages')===sa)score++;if(sl!=='all'&&post.lengthType===sl)score++;return{post,score,matched}}).sort((a,b)=>b.score-a.score);const matched=scored.filter(r=>r.score>0),rest=shuffle(scored.filter(r=>r.score===0)),final=[...matched,...rest].slice(0,10);resultList.replaceChildren();if(!final.length){resultCount.textContent='추천할 글이 아직 없어요.'}else{resultCount.textContent=`${final.length}편을 추천해요`;final.forEach(({post,matched},i)=>{const c=document.createElement('div');c.className='result-card'+(i===0?' top':'');const rank=document.createElement('div');rank.className='rrank';rank.textContent=i+1;const body=document.createElement('div');body.className='rbody';const tr=document.createElement('div');tr.className='rtop';const a=document.createElement('a');a.href=post.link;a.target='_blank';a.rel='noopener noreferrer';a.className='rtitle';a.textContent=post.title||'(제목 없음)';const au=document.createElement('span');au.className='rauthor';au.textContent='by '+(post.author||'');tr.append(a,au);body.appendChild(tr);if(matched.length){const m=document.createElement('div');m.className='rmatch';[...new Set(matched)].forEach(t=>{const x=document.createElement('span');x.className='mtag';x.textContent=t;m.appendChild(x)});body.appendChild(m)}c.append(rank,body);resultList.appendChild(c)})}surveyForm.style.display='none';surveyResults.style.display='block'}surveyRetryBtn.addEventListener('click',startSurvey);
window.addEventListener('keydown',e=>{if(e.key==='Escape'){surveyOverlay.classList.remove('open');if(addBox.open&&!editingId)addBox.open=false}});loadPosts();
